name: NeoDesk Support Agent generic release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit, branch or tag to build"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish a GitHub Release"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "support-v*"

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('support-{0}', github.sha) }}

jobs:
  build:
    name: Build generic incoming-only clients
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: generic-${{ github.sha }}
      source-ref: ${{ inputs.source_ref || github.sha }}
      generic-support: true
    secrets: inherit

  package:
    name: Package and verify generic agents
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1

      - name: Assert packaging scripts present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/sign_release_manifest.py ]]; then
            echo "::error::scripts/sign_release_manifest.py missing after checkout — packaging job cannot sign the release manifest"
            exit 1
          fi

      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: raw/windows-x86_64

      - name: Download Windows ARM64
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-aarch64
          path: raw/windows-aarch64

      - name: Download macOS Intel
        uses: actions/download-artifact@v4
        with:
          name: neodesk-unsigned-macos-x86_64
          path: raw/macos-x86_64

      - name: Download macOS ARM64
        uses: actions/download-artifact@v4
        with:
          name: neodesk-unsigned-macos-aarch64
          path: raw/macos-aarch64

      - name: Download Linux x64 package
        uses: actions/download-artifact@v4
        with:
          pattern: neodesk-*-x86_64.deb
          path: raw/linux-x86_64
          merge-multiple: true

      - name: Download Linux ARM64 package
        uses: actions/download-artifact@v4
        with:
          pattern: neodesk-*-aarch64.deb
          path: raw/linux-aarch64
          merge-multiple: true

      - name: Download Windows installers (EXE + MSI)
        uses: actions/download-artifact@v4
        with:
          pattern: neodesk-windows-installers-*
          path: raw/windows-installers
          merge-multiple: true

      - name: Package and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out stage

          # The version in the file names: the tag without support-v, or the
          # tag the release job makes up for a manual run.
          if [[ "${GITHUB_REF_NAME}" == support-v* ]]; then
            version="${GITHUB_REF_NAME#support-v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          export SUPPORT_VERSION="$version"

          # x86_64 -> x64, aarch64 -> arm64, as Windows and macOS say it.
          label() { [[ "$1" == x86_64 ]] && echo x64 || echo arm64; }

          package_windows() {
            local arch="$1"
            local source="raw/windows-${arch}"
            local base="NeoDesk-Support-${version}-$(label "$arch")"
            test -d "$source"
            ! find "$source" \( -iname custom.txt -o -name .custom-txt-here \) -print -quit | grep -q .
            (cd "$source" && zip -qr "../../out/${base}.zip" .)

            # Prefer built EXE/MSI from SignOutput (same generic-support binary).
            local exe msi
            exe="$(find raw/windows-installers -type f -name "neodesk-*-${arch}.exe" | head -n1 || true)"
            msi="$(find raw/windows-installers -type f -name "neodesk-*-${arch}.msi" | head -n1 || true)"
            if [ -n "$exe" ]; then
              cp "$exe" "out/${base}.exe"
            fi
            if [ -n "$msi" ]; then
              cp "$msi" "out/${base}.msi"
            else
              echo "::warning::No MSI found for windows-${arch} — zip/portable only for this arch"
            fi
          }

          package_macos() {
            local arch="$1"
            local source="raw/macos-${arch}"
            local archive
            archive="$(find "$source" -type f -name '*-app.tar.gz' -print -quit)"
            test -n "$archive"
            mkdir -p "stage/macos-${arch}"
            tar -xzf "$archive" -C "stage/macos-${arch}"
            ! find "stage/macos-${arch}" \( -iname custom.txt -o -name .custom-txt-here \) -print -quit | grep -q .
            tar -C stage -czf "out/NeoDesk-Support-${version}-macOS-$(label "$arch").tar.gz" "macos-${arch}"
          }

          package_linux() {
            local arch="$1"
            local deb
            deb="$(find "raw/linux-${arch}" -type f -name '*.deb' -print -quit)"
            test -n "$deb"
            mkdir -p "stage/linux-${arch}/root"
            dpkg-deb -x "$deb" "stage/linux-${arch}/root"
            ! find "stage/linux-${arch}" \( -iname custom.txt -o -name .custom-txt-here \) -print -quit | grep -q .
            tar -C "stage/linux-${arch}" -czf "out/NeoDesk-Support-${version}-Linux-$(label "$arch").tar.gz" root
          }

          package_windows x86_64
          package_windows aarch64
          package_macos x86_64
          package_macos aarch64
          package_linux x86_64
          package_linux aarch64

          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from generate_release_download_table import classify_support

          assets = []
          for item in sorted(Path("out").iterdir()):
              if item.is_file():
                  name = item.name
                  hit = classify_support(name)
                  if not hit or not name.startswith(f"NeoDesk-Support-{os.environ['SUPPORT_VERSION']}-"):
                      raise SystemExit(f"unexpected generic asset name: {name}")
                  platform, arch, fmt = hit
                  assets.append({
                      "name": name,
                      "platform": platform,
                      "arch": arch,
                      "format": fmt,
                      "sha256": hashlib.sha256(item.read_bytes()).hexdigest(),
                      "size": item.stat().st_size,
                  })
          manifest = {
              "schema_version": 1,
              "sku": "neodesk-support",
              "generic": True,
              "source_commit": "${{ github.sha }}",
              "external_config": False,
              "assets": assets,
          }
          (Path("out") / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (Path("out") / "SHA256SUMS").write_text(
              "".join(f"{a['sha256']}  {a['name']}\n" for a in assets)
          )
          PY

          python3 -m pip install --disable-pip-version-check PyNaCl
          NEODESK_SUPPORT_RELEASE_SIGNING_SEED="${{ secrets.NEODESK_SUPPORT_RELEASE_SIGNING_SEED }}" \
            python3 scripts/sign_release_manifest.py out/manifest.json out/manifest.sig

          ! find out \( -iname custom.txt -o -name .custom-txt-here \) -print -quit | grep -q .

      - name: Upload generic release bundle
        uses: actions/upload-artifact@v4
        with:
          name: neodesk-support-generic-${{ github.sha }}
          path: out

  release:
    if: startsWith(github.ref, 'refs/tags/support-v') || inputs.publish_release
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout note generator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1

      - name: Download generic release bundle
        uses: actions/download-artifact@v4
        with:
          name: neodesk-support-generic-${{ github.sha }}
          path: out

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/support-v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != support-v* ]]; then
            tag="support-v0.0.${GITHUB_RUN_NUMBER}"
          fi
          title="NeoDesk Support Agent $tag"

          {
            echo "### Notes"
            echo
            echo "- Nothing is baked into these packages: the server is entered on first start, or given to the MSI as the properties SERVER, KEY, API, TOKEN and GROUP, which install the receiver app."
            echo "- In the console: **Add computers › Support agents › Import latest release**. After that, **Add computers › Receiver app** downloads the MSI with this server's values."
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > support-extra.md

          python3 scripts/generate_release_download_table.py \
            --product support \
            --asset-dir out \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${tag}" \
            --release-name "${title}" \
            --commit "${GITHUB_SHA}" \
            --extra-md-file support-extra.md \
            -o release-notes.md

          # Never the latest release: the latest one is the desktop client,
          # which the server's client release cache serves. Not a pre-release
          # either, since the server's import skips pre-releases.
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file release-notes.md \
            --latest=false
