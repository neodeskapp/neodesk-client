# NeoDesk Client (full desktop client): build, and release on tags.
#
# Every push to main builds the client for all six desktop
# targets and keeps the packages as workflow artifacts of the run. Nothing is
# published.
#
# A desktop/<version> or desktop-v<version> tag builds the same and publishes
# a GitHub Release on this repository with a download table in the release
# notes. The console only takes releases whose tag has no slash, so it can
# use desktop-v* releases but not desktop/* ones. After a desktop-v* release
# the packages job updates https://pkg.neode.sk (neodesk-packages.yml).
#
# Package versions: a tag's version for releases, <Cargo.toml version>-dev.<run
# number> for everything else (neodesk-1.5.0-dev.42-windows-x86_64.exe).
#
# Manual runs (workflow_dispatch) build one platform or all of them, as
# artifacts only:
#   gh workflow run neodesk-desktop-release.yml --ref main -f platforms=linux-x86_64
#
# Incoming-only Support Agent packages are a separate workflow:
#   neodesk-support-generic-release.yml (tags support-v*).
#
name: NeoDesk desktop release

on:
  push:
    branches:
      - main
    tags:
      - "desktop/*"
      - "desktop-v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - "PRIVACY"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platform to build (artifacts only, no release)"
        type: choice
        required: true
        default: all
        options:
          - all
          - windows-x86_64
          - windows-aarch64
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64

# A newer push ends the older run of the same branch; a manual run only ends
# an older manual run, so rerunning one platform leaves a push run alone.
concurrency:
  group: neodesk-desktop-release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Clean full client only — never bake Support Agent custom.txt in CI.
  PRODUCT: neodesk-desktop
  PRODUCT_SKU: neodesk-desktop

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      platforms: ${{ steps.meta.outputs.platforms }}
      dist_name: ${{ steps.meta.outputs.dist_name }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_dev: ${{ steps.meta.outputs.is_dev }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute tag and changelog range
        id: meta
        shell: bash
        env:
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          RUN_N="${GITHUB_RUN_NUMBER}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Only a desktop/* tag publishes a release, always with every platform.
            PUBLISH=true
            PLATFORMS=all
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#desktop/}"
            VERSION="${VERSION#desktop-}"
            VERSION="${VERSION#v}"
            # Tagged releases are still prereleases when the name says dev, nightly or snapshot
            if echo "${TAG_NAME}" | grep -Eqi 'dev|nightly|snapshot'; then
              IS_DEV=true
            else
              IS_DEV=false
            fi
          else
            # Branch pushes and manual runs keep the packages as run artifacts.
            PUBLISH=false
            PLATFORMS="${INPUT_PLATFORMS:-all}"
            TAG_NAME="dev-${RUN_N}-${SHORT_SHA}"
            VERSION="${BASE_VERSION}-dev.${RUN_N}"
            IS_DEV=true
          fi
          # A dev build or a version with a suffix (1.5.0-rc.1, 1.5.0-beta.2) is a
          # pre-release; only a plain <major>.<minor>.<patch> becomes the latest release.
          PRERELEASE="${IS_DEV}"
          case "${VERSION}" in *-*) PRERELEASE=true ;; esac
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "::error::Version ${VERSION} (from ${GITHUB_REF_NAME}) is not <major>.<minor>.<patch>[-<suffix>]"
            exit 1
          fi

          if [ "${IS_DEV}" = "true" ]; then
            RELEASE_NAME="NeoDesk Client ${VERSION} (dev ${RUN_N})"
          else
            RELEASE_NAME="NeoDesk Client ${VERSION}"
          fi

          # Previous NeoDesk desktop tag for changelog (fallback: last 20 commits)
          PREV="$(git describe --tags --abbrev=0 --match 'desktop/*' --match 'desktop-v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "${PREV}" ]; then
            PREV="$(git rev-list --max-count=1 HEAD~20 2>/dev/null || echo "")"
          fi

          {
            echo "publish=${PUBLISH}"
            echo "version=${VERSION}"
            echo "platforms=${PLATFORMS}"
            echo "dist_name=neodesk-desktop-${VERSION}-${SHORT_SHA}"
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "is_dev=${IS_DEV}"
            echo "prerelease=${PRERELEASE}"
            echo "previous_tag=${PREV}"
          } | tee -a "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ needs.prepare.outputs.tag_name }}
      platforms: ${{ needs.prepare.outputs.platforms }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  package:
    name: Package clean NeoDesk Client
    needs: [prepare, build]
    # A release needs every build. Artifact-only runs package whatever built,
    # so one broken platform does not hide the others.
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.prepare.outputs.publish != 'true' && needs.build.result == 'failure'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Cargo.toml and pubspec.yaml carry the version without the -dev or
      # other suffix.
      - name: Validate release metadata
        run: python3 scripts/validate_release_metadata.py --version "${VERSION%%-*}"

      - name: Download Windows unsigned
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-windows-*
          path: dist-raw
          merge-multiple: false

      - name: Download MSI templates
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-msi-template-*
          path: dist-raw/msi-template-arts
          merge-multiple: true

      - name: Download macOS unsigned
        uses: actions/download-artifact@v4
        with:
          pattern: neodesk-unsigned-macos-*
          path: dist-raw
          merge-multiple: false

      - name: Download Linux debs
        uses: actions/download-artifact@v4
        with:
          pattern: "neodesk-*.deb"
          path: dist-raw/linux-debs
          merge-multiple: true

      - name: Download Linux rpms
        uses: actions/download-artifact@v4
        with:
          pattern: "neodesk-*-rpms"
          path: dist-raw/linux-rpms
          merge-multiple: true

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          pattern: neodesk-windows-installers-*
          path: dist-raw/windows-installers
          merge-multiple: true

      - name: Collect packages under their published names
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_collect_desktop_dist.py
          bash scripts/collect_desktop_dist.sh collect dist-raw dist "${VERSION}"
          ls -la dist/clean
          ls -laR dist > dist-layout.txt
          head -n 200 dist-layout.txt

      - name: Pack generator templates (clean binaries only)
        shell: bash
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          set -euo pipefail
          python3 scripts/test_generator_contract.py
          # Templates are clean trees for the console Generator — not a Support build.
          # Support Agent custom.txt is applied by the panel, never in this workflow.
          # Artifact-only runs check the templates but do not keep the archive.
          if [ "${PUBLISH}" = "true" ]; then
            pack_args=(--archive)
          else
            pack_args=(--allow-missing)
          fi
          python3 scripts/pack_generator_templates.py \
            --dist-root dist \
            --out dist/generator-templates \
            --version "${VERSION}" \
            "${pack_args[@]}"
          python3 scripts/validate_generator_templates.py --root dist/generator-templates \
            $([ "${PUBLISH}" = "true" ] || echo --allow-missing)
          if [ "${PUBLISH}" = "true" ]; then
            cp dist/generator-templates-*.tar.gz dist/clean/
            cp dist/generator-templates-*.tar.gz.sha256 dist/clean/
            cp dist/generator-templates/manifest.json dist/clean/neodesk-${VERSION}-generator-manifest.json
          fi

      - name: Write clean desktop manifest
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          root = Path("dist/clean")
          assets = []
          for p in sorted(root.glob("neodesk-*")):
              if p.name.endswith("manifest.json"):
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assets.append({"name": p.name, "sha256": h, "size": p.stat().st_size})
          manifest = {
              "schema_version": 1,
              "product": os.environ.get("PRODUCT", "neodesk-desktop"),
              "sku": os.environ.get("PRODUCT_SKU", "neodesk-desktop"),
              "variant": "clean",
              "version": version,
              "note": (
                  "Official NeoDesk Client (full). No custom.txt / no Support Agent bake-in. "
                  "Configure Settings → Network. Incoming-only Support Agents are separate support-v* releases."
              ),
              "assets": assets,
          }
          Path("dist/clean/neodesk-desktop-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Add MSI templates to the release assets
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d dist/msi-template ]; then
            cp -a dist/msi-template/. dist/clean/
          fi

      - name: Write SHA256SUMS
        shell: bash
        run: |
          bash scripts/collect_desktop_dist.sh sums dist/clean
          cat dist/clean/SHA256SUMS

      # SHA256SUMS.sig, which the console checks before it serves a package.
      # Without the key (forks) the packages stay unsigned; a release needs it.
      - name: Sign SHA256SUMS
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            if [ "${PUBLISH}" = "true" ]; then
              echo "::error::RELEASE_SIGNING_KEY is not set; a release without SHA256SUMS.sig cannot be served."
              exit 1
            fi
            echo "::notice::RELEASE_SIGNING_KEY is not set; SHA256SUMS stays unsigned."
            exit 0
          fi
          bash scripts/collect_desktop_dist.sh sign dist/clean
          cat dist/clean/SHA256SUMS.sig

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.prepare.outputs.dist_name }}
          path: dist/clean/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.dist_name }}
          path: dist/clean

      - name: Build release notes
        id: notes
        shell: bash
        env:
          PREV: ${{ needs.prepare.outputs.previous_tag }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          IS_DEV: ${{ needs.prepare.outputs.is_dev }}
        run: |
          set -euo pipefail
          RANGE="${GITHUB_SHA}"
          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..${GITHUB_SHA}"
          fi

          {
            echo "### Development changes"
            echo
            if git rev-parse --verify "${PREV}" >/dev/null 2>&1 || git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
              git log --pretty=format:'- %s (%h)' "${RANGE}" | head -n 80
              echo
            else
              git log --pretty=format:'- %s (%h)' -n 20
              echo
            fi
            echo
            echo "### Notes"
            echo
            echo "- Windows: portable **EXE** and installed **MSI** for x86_64 and ARM64."
            echo "- Configure servers in Settings → Network, or import a deploy string from the NeoDesk panel."
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ "${IS_DEV}" = "true" ]; then
              echo "- This is a **development prerelease**."
            fi
          } > changelog-extra.md

          # release-notes/<tag>.md, when the tag has one, comes first in place
          # of the generated heading; the download table follows it
          python3 scripts/generate_release_download_table.py \
            --product desktop \
            --asset-dir dist/clean \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG_NAME}" \
            --release-name "${RELEASE_NAME}" \
            --commit "${GITHUB_SHA}" \
            --extra-md-file changelog-extra.md \
            --intro-md-file "release-notes/${TAG_NAME}.md" \
            -o release-notes.md

          echo "Wrote release-notes.md"
          head -n 60 release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
          files: |
            dist/clean/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # apt, dnf and zypper repository at https://pkg.neode.sk, and the winget
  # manifests of a stable release. A release published with GITHUB_TOKEN
  # starts no other workflow, so the release run calls it.
  packages:
    name: Publish packages
    needs: [prepare, release]
    if: needs.prepare.outputs.publish == 'true' && startsWith(needs.prepare.outputs.tag_name, 'desktop-v')
    permissions:
      contents: read
    uses: ./.github/workflows/neodesk-packages.yml
    with:
      tag: ${{ needs.prepare.outputs.tag_name }}
    secrets: inherit
