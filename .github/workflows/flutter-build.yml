# NeoDesk desktop agent builds only (Windows / Linux / macOS).
# Called from neodesk-desktop-release.yml. No Android, iOS, Sciter, AppImage,
# Flatpak, DRM, or web. Artifacts are the standard full client (not incoming-only).
name: Build NeoDesk desktop

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "nightly"
      support-config-b64:
        description: "Signed embedded Support config; empty for the full Client"
        type: string
        default: ""
      generic-support:
        description: "Build a generic incoming-only Support Agent without server configuration"
        type: boolean
        default: false
      source-ref:
        description: "Exact source commit for an embedded Support build"
        type: string
        default: ""
      platforms:
        description: >-
          Space-separated targets to build, or "all": windows-x86_64 windows-aarch64
          linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64
        type: string
        default: "all"
      version:
        description: >-
          The release's version with its suffix (1.5.0-rc.4). The client
          reports it and the deb and rpm carry it (1.5.0~rc.4); empty is
          the version in Cargo.toml.
        type: string
        default: ""

env:
  # Keep 1.75 on desktop Flutter/Windows (ABI / historical constraints from upstream).
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81" # https://github.com/yury/cidre requires 1.81
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: first stable Flutter with native arm64 Windows engine.
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  # vcpkg keeps built ports as zip files in VCPKG_BINCACHE; actions/cache
  # carries that folder from run to run (vcpkg's own x-gha backend is gone).
  VCPKG_BINCACHE: "${{ github.workspace }}/vcpkg-bincache"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
  # vcpkg version: 2026.07.29 — if changed, run `$VCPKG_ROOT/vcpkg x-update-baseline`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.0"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  NEODESK_SUPPORT_CONFIG_B64: "${{ inputs.support-config-b64 }}"
  NEODESK_GENERIC_SUPPORT: "${{ inputs.generic-support && '1' || '' }}"
  NEODESK_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  # Turns the platforms input into the matrices of the jobs below. A family
  # with nothing to build gets "[]" and its job is skipped.
  plan:
    name: Plan desktop builds
    runs-on: ubuntu-22.04
    outputs:
      bridge: ${{ steps.plan.outputs.bridge }}
      topmost: ${{ steps.plan.outputs.topmost }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      linux: ${{ steps.plan.outputs.linux }}
    steps:
      - name: Plan
        id: plan
        shell: python
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          import json, os

          windows = {
              "x86_64": {
                  "target": "x86_64-pc-windows-msvc",
                  "os": "windows-2022",
                  "arch": "x86_64",
                  "flutter-arch": "x64",
                  "vcpkg-triplet": "x64-windows-static",
                  "rust-target-cache": True,
                  "build-args": "--vram",
              },
              "aarch64": {
                  "target": "aarch64-pc-windows-msvc",
                  "os": "windows-11-arm",
                  "arch": "aarch64",
                  "flutter-arch": "arm64",
                  "vcpkg-triplet": "arm64-windows-static",
                  "rust-target-cache": False,
                  # vram is x86/x64-only (NVENC needs CUDA, Intel MediaSDK needs __rdtsc);
                  # no NV/Intel/AMD hardware exists on Windows-on-ARM, so vram stays disabled here.
                  "build-args": "",
              },
          }
          topmost = {
              "x86_64": {"target": "windows-2022", "platform": "x64"},
              "aarch64": {"target": "windows-11-arm", "platform": "ARM64"},
          }
          macos = {
              "x86_64": {
                  "target": "x86_64-apple-darwin",
                  "os": "macos-15-intel",
                  "extra-build-args": "",
                  "arch": "x86_64",
                  "vcpkg-triplet": "x64-osx",
                  "rust-target-cache": True,
              },
              "aarch64": {
                  "target": "aarch64-apple-darwin",
                  "os": "macos-15",
                  # "--disable-flutter-texture-render" stays off on mac: users report flickering
                  # on both arm and x64, https://github.com/rustdesk/rustdesk/issues/6296
                  "extra-build-args": "--screencapturekit",
                  "arch": "aarch64",
                  "vcpkg-triplet": "arm64-osx",
                  "rust-target-cache": True,
              },
          }
          linux = {
              "x86_64": {
                  "arch": "x86_64",
                  "target": "x86_64-unknown-linux-gnu",
                  "distro": "ubuntu18.04",
                  "on": "ubuntu-22.04",
                  "deb_arch": "amd64",
                  "vcpkg-triplet": "x64-linux",
                  "rust-target-cache": True,
              },
              "aarch64": {
                  "arch": "aarch64",
                  "target": "aarch64-unknown-linux-gnu",
                  "distro": "ubuntu18.04",
                  "on": "ubuntu-22.04-arm",
                  "deb_arch": "arm64",
                  "vcpkg-triplet": "arm64-linux",
                  "rust-target-cache": False,
              },
          }
          # Flutter 3.22.3 makes the bridge for every build except Windows arm64,
          # which builds with Flutter 3.44 and needs a bridge made with it.
          bridge = {
              "default": {
                  "target": "x86_64-unknown-linux-gnu",
                  "os": "ubuntu-22.04",
                  "extra-build-args": "",
                  "flutter-version": "3.22.3",
                  "artifact-name": "bridge-artifact",
              },
              "flutter-3.44": {
                  "target": "x86_64-unknown-linux-gnu",
                  "os": "ubuntu-22.04",
                  "extra-build-args": "",
                  "flutter-version": "3.44.8",
                  "artifact-name": "bridge-artifact-flutter-3.44",
              },
          }

          # The repository has 10 GB of cache. A Rust target cache takes 1.3 to
          # 2.1 GB, so only the builds the console serves first keep one
          # ("rust-target-cache" above); Windows and Linux arm64 build from scratch.
          families = {"windows": windows, "linux": linux, "macos": macos}
          known = [f"{family}-{arch}" for family, table in families.items() for arch in table]
          requested = os.environ.get("PLATFORMS", "").split() or ["all"]
          if requested == ["all"]:
              requested = known
          unknown = sorted(set(requested) - set(known))
          if unknown:
              raise SystemExit(f"unknown platforms: {' '.join(unknown)}; known: {' '.join(known)}")

          def pick(family):
              return [arch for arch in families[family] if f"{family}-{arch}" in requested]

          out = {
              "windows": [windows[arch] for arch in pick("windows")],
              "topmost": [topmost[arch] for arch in pick("windows")],
              "macos": [macos[arch] for arch in pick("macos")],
              "linux": [linux[arch] for arch in pick("linux")],
              "bridge": [],
          }
          if pick("linux") or pick("macos") or "x86_64" in pick("windows"):
              out["bridge"].append(bridge["default"])
          if "aarch64" in pick("windows"):
              out["bridge"].append(bridge["flutter-3.44"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in out.items():
                  fh.write(f"{key}={json.dumps(value)}\n")
                  print(f"{key}: {json.dumps(value, indent=2)}")

  generate-bridge:
    needs: [plan]
    uses: ./.github/workflows/bridge.yml
    with:
      matrix: ${{ needs.plan.outputs.bridge }}

  build-RustDeskTempTopMostWindow:
    needs: [plan]
    if: needs.plan.outputs.topmost != '[]'
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.topmost) }}
    with:
      upload-artifact: ${{ inputs.upload-artifact }}
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [plan, build-RustDeskTempTopMostWindow, generate-bridge]
    # Runs when one bridge or TopMostWindow leg failed too: the leg that needs the
    # missing artifact then fails at its download, the other builds go on.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.windows != '[]' &&
      needs.generate-bridge.result != 'skipped' && needs.build-RustDeskTempTopMostWindow.result != 'skipped'
    runs-on: ${{ matrix.job.os }}
    env:
      # Windows files are signed through Azure Artifact Signing as "Rath & Blume GbR"
      # when the repository has the AZURE_* secrets (forks and PRs have none, and
      # build unsigned).
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && 'true' || 'false' }}
      # The product name the signatures carry, which UAC shows for the MSI. A
      # Support Agent build has another name and leaves it out.
      WINDOWS_SIGNING_DESCRIPTION: ${{ (inputs.support-config-b64 == '' && !inputs.generic-support) && 'NeoDesk Client' || '' }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          submodules: recursive

      - name: Validate desktop packaging contract
        run: python scripts/validate_desktop_packaging.py

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64 is on Flutter 3.44, so it needs the bridge generated with the same Flutter
          # (its *.freezed.dart must match the freezed the arm64 build resolves). x64 and every
          # other platform keep the default 3.22.3-generated bridge.
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        # arm64 builds with FLUTTER_WINDOWS_ARM_VERSION (>=3.44); x64 stays on FLUTTER_VERSION.
        # subosito only ships an x64 Windows SDK (Flutter's release manifest lists x64 only),
        # so it installs x64 on both arches. The arm64 runner re-bootstraps Dart to arm64 in
        # the next step.
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
          architecture: x64

      - name: Force arm64 Dart SDK + engine
        # The x64 SDK subosito installs bundles an x64 Dart with a matching engine-dart-sdk.stamp,
        # so update_dart_sdk.ps1 short-circuits (stamp matches -> return) and keeps x64 Dart;
        # `flutter build windows` then targets the Dart VM's arch = x64, even on this arm64 host.
        # On this native-arm64 runner (PROCESSOR_ARCHITECTURE=ARM64), deleting the stamp and
        # re-running update_dart_sdk.ps1 pulls the arm64 Dart (available since Flutter 3.44.0).
        # https://github.com/flutter/flutter/issues/186730#issuecomment-4573214964
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: |
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Flutter root: $flutterRoot"
          Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          # Confirm the Dart we ended up with is arm64 ("on windows_arm64"); fail loudly if not.
          $dartVer = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVer
          if ($dartVer -notmatch "windows_arm64") {
            Write-Error "Expected an arm64 Dart SDK but got: $dartVer"
            exit 1
          }
          & "$flutterRoot\bin\flutter.bat" precache --windows
          # Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should
          # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.
          $engineDir = "$flutterRoot\bin\cache\artifacts\engine"
          Write-Host "Engine artifacts present:"
          Get-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host
          if (-not (Test-Path "$engineDir\windows-arm64-release")) {
            Write-Error "Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK)."
            exit 1
          }

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: arm64 uses the stock native arm64 Windows engine, and the rustdesk/engine
      # windows-x64-release.zip is built for the 3.24-era x64 engine (matches FLUTTER_VERSION).
      - name: Replace engine with rustdesk custom flutter engine
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        # arm64 is on Flutter 3.44 (patched separately below) and does not use this patch.
        if: ${{ matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        # arm64 is the only target on Flutter 3.44; apply its source/pubspec deltas on the fly
        # (shared with the 3.44 bridge job) so the committed sources stay on Flutter 3.24.5.
        # `flutter build` then runs `pub get`, regenerating pubspec.lock for the bumped deps.
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      # The install script's lines that name the app, the rule for
      # rustdesk:// and what a quick support session may have, which key a
      # join or a pairing sends, and the tray menu's entries; the files need
      # only std, so their tests run without building the client.
      - name: Test the install command builders
        shell: pwsh
        run: |
          foreach ($file in 'src/platform/windows/install_commands.rs', 'src/platform/windows/link_schemes.rs', 'src/onboard/grants.rs', 'src/onboard/device_key.rs', 'src/hbbs_http/pairing_proof.rs', 'src/tray_model.rs') {
            $name = [IO.Path]::GetFileNameWithoutExtension($file)
            rustc --edition 2021 --test $file -o "$env:RUNNER_TEMP\${name}_test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$env:RUNNER_TEMP\${name}_test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # A different key without the targets, so no run keeps restoring an
          # older entry that has them.
          prefix-key: ${{ matrix.job.os }}${{ !matrix.job.rust-target-cache && '-registry' || '' }}
          cache-targets: ${{ matrix.job.rust-target-cache }}
          cache-on-failure: true

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-
            vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        id: vcpkg-install
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          bincache="${VCPKG_BINCACHE}"
          if command -v cygpath >/dev/null; then bincache="$(cygpath -u "${bincache}")"; fi
          cached_before="$({ find "${bincache}" -name '*.zip' 2>/dev/null || true; } | wc -l)"
          status=0
          $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed" || status=$?
          cached_after="$({ find "${bincache}" -name '*.zip' 2>/dev/null || true; } | wc -l)"
          echo "vcpkg binary cache: ${cached_before} -> ${cached_after} packages"
          if [ "${cached_after}" -gt "${cached_before}" ]; then
            echo "built=true" >> "${GITHUB_OUTPUT}"
          fi
          if [ "${status}" -ne 0 ]; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      # Saved right away whenever vcpkg built something, also when a port
      # failed, so the next run starts from the ports that did build.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-install.outputs.built == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Set SODIUM_LIB_DIR (arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib; point it at the vcpkg-built one
        # (only for arm64 — leaving it unset lets x64 use the crate's bundled lib).
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk
          # NeoDesk fork ships neodesk.exe; keep rustdesk.exe alias for upstream WiX paths
          if (Test-Path ./rustdesk/neodesk.exe) {
            if (-not (Test-Path ./rustdesk/rustdesk.exe)) {
              Copy-Item ./rustdesk/neodesk.exe ./rustdesk/rustdesk.exe
            }
          } elseif (Test-Path ./rustdesk/rustdesk.exe) {
            Copy-Item ./rustdesk/rustdesk.exe ./rustdesk/neodesk.exe
          }

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.upload-artifact }}
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
          path: "./rustdesk"

      # The app's own exe and dll files, before the portable packer and the MSI
      # wrap them. Driver packages keep their files as they are: their catalog
      # signature covers the file hashes.
      - name: Sign the app files
        if: env.UPLOAD_ARTIFACT == 'true' && env.WINDOWS_SIGNING == 'true'
        uses: ./.github/actions/sign-windows
        with:
          paths: ${{ github.workspace }}\rustdesk
          exclude: '\\(drivers|usbmmidd_v2)\\'
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Named "unsigned" for the packaging jobs that read it; with signing on, the
      # files in it are signed.
      - name: Upload unsigned
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
          path: rustdesk

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          # Prefer NeoDesk exe name when packing portable
          EXE=../../rustdesk/neodesk.exe
          if [ ! -f "$EXE" ]; then EXE=../../rustdesk/rustdesk.exe; fi
          python3 ./generate.py -f ../../rustdesk/ -o . -e "$EXE"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
          cp ./SignOutput/neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        # Builds the MSI for the matrix arch. res/msi (WiX v4 + native CustomActions) carries
        # both x64 and ARM64 platform configs; WcaUtil/DUtil ship arm64 libs. msbuild platform
        # is x64 / ARM64; the produced Package.msi is globbed since its bin/<platform>/ dir varies.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name "NeoDesk Client"
          nuget restore msi.sln
          $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
          Copy-Item ../../SignOutput/neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi ../../SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
          sha256sum ../../SignOutput/neodesk-*.msi

      - name: Sign the portable exe and the MSI
        if: env.UPLOAD_ARTIFACT == 'true' && env.WINDOWS_SIGNING == 'true'
        uses: ./.github/actions/sign-windows
        with:
          paths: ${{ github.workspace }}\SignOutput
          description: ${{ env.WINDOWS_SIGNING_DESCRIPTION }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build pre-built MSI template
        # Two things this works around: preprocess.py rewrites res/msi in place, so the
        # tree is reset around this second variant; and it locates the app as
        # <app-name>.exe inside the dist, so the dist copy is renamed to match.
        #
        # The placeholder is chosen to keep this template as close to the shipped msi as
        # possible: eight characters like "RustDesk", and a valid 8.3 name, so WiX
        # derives no short name for it. A longer placeholder would get one, and a patch
        # cannot rewrite a truncated placeholder, leaving short names pointing at it.
        #
        # It still has to be unique, which is why "RustDesk" itself cannot be used:
        # it also names payload that must never be renamed, such as librustdesk.dll
        # and drivers\RustDeskPrinterDriver.
        #
        #
        # Building the arm64 template on the native arm64 runner makes the ARM
        # package available: the build agents are x64 and cannot run
        # preprocess.py against an ARM exe.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          git checkout -- res/msi
          cp -r ./rustdesk ./rustdesk-msi-template
          if (Test-Path ./rustdesk-msi-template/neodesk.exe) {
            Move-Item -Force ./rustdesk-msi-template/neodesk.exe ./rustdesk-msi-template/RDAPPNAM.exe
            Remove-Item -ErrorAction SilentlyContinue ./rustdesk-msi-template/rustdesk.exe
          } else {
            mv ./rustdesk-msi-template/rustdesk.exe ./rustdesk-msi-template/RDAPPNAM.exe
          }
          Set-Content -Path ./rustdesk-msi-template/custom.txt -Value 'placeholder' -NoNewline
          $assets = './rustdesk-msi-template/data/flutter_assets/assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          foreach ($a in 'icon.ico','icon.png','logo.png','logo_light.png','logo_dark.png') {
            Set-Content -Path "$assets/$a" -Value 'placeholder' -NoNewline
          }
          pushd ./res/msi
          python preprocess.py --arp --template --revision-version 0 -d ../../rustdesk-msi-template --app-name RDAPPNAM --exe-name RDAPPNAM.exe
          $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -t:clean -p:Configuration=Release -p:Platform=$msiPlatform
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mkdir ./msi-template
          mv $msi.FullName ./msi-template/neodesk-template-${{ matrix.job.arch }}.msi
          Copy-Item ./msi-template/neodesk-template-${{ matrix.job.arch }}.msi ./msi-template/rustdesk-template-${{ matrix.job.arch }}.msi
          git checkout -- res/msi
          rm -r -fo ./rustdesk-msi-template

      - name: Upload unsigned msi template
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-msi-template-${{ matrix.job.arch }}
          path: ./msi-template

      # With signing on, every exe and msi this job ships has to carry a valid,
      # timestamped signature by the publisher. The MSI template is left out: the console
      # generator rewrites it, which would break any signature.
      - name: Check the signatures
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Recurse -File ./rustdesk, ./SignOutput |
            Where-Object { $_.Extension -in '.exe', '.msi' -and $_.FullName -notmatch '\\(drivers|usbmmidd_v2)\\' })
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Host "$($f.FullName): $($s.Status) $($s.SignerCertificate.Subject) timestamp: $($s.TimeStamperCertificate.Subject)"
            if ($env:WINDOWS_SIGNING -eq 'true') {
              if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch '^CN="?Rath & Blume GbR' -or -not $s.TimeStamperCertificate) { $bad++ }
            }
          }
          if ($files.Count -eq 0) { throw "no exe or msi found to check" }
          if ($bad) { throw "$bad file(s) without a valid, timestamped Rath & Blume GbR signature" }

      - name: Upload Windows installers
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neodesk-windows-installers-${{ matrix.job.arch }}
          path: |
            ./SignOutput/neodesk-*.msi
            ./SignOutput/neodesk-*.exe

      # GitHub Release is published only by neodesk-desktop-release.yml.

  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [plan, generate-bridge]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.macos != '[]' &&
      needs.generate-bridge.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          submodules: recursive

      - name: Import the codesign cert
        if: env.MACOS_P12_BASE64 != null
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: rustdesk

      - name: Check sign and import sign key
        if: env.MACOS_P12_BASE64 != null
        run: |
          security default-keychain -s rustdesk.keychain
          security find-identity -v

      - name: Import notarize key
        if: env.MACOS_P12_BASE64 != null
        uses: timheuer/base64-to-file@adaa40c0c581f276132199d4cf60afa07ce60eac # v1.2
        with:
          # https://gregoryszorc.com/docs/apple-codesign/stable/apple_codesign_rcodesign.html#notarizing-and-stapling
          fileName: rustdesk.json
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.MACOS_NOTARIZE_JSON }}

      - name: Install rcodesign tool
        if: env.MACOS_P12_BASE64 != null
        shell: bash
        run: |
          pushd /tmp
          wget https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz
          tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz
          mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin
          popd

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # Install NASM 2.16.x from official release.
          # Do NOT use `brew install nasm` which installs NASM 3.x.
          # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
          # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # A different key without the targets, so no run keeps restoring an
          # older entry that has them.
          prefix-key: ${{ matrix.job.os }}${{ !matrix.job.rust-target-cache && '-registry' || '' }}
          cache-targets: ${{ matrix.job.rust-target-cache }}
          cache-on-failure: true

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-
            vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-${{ matrix.job.os }}-${{ matrix.job.vcpkg-triplet }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        id: vcpkg-install
        run: |
          bincache="${VCPKG_BINCACHE}"
          if command -v cygpath >/dev/null; then bincache="$(cygpath -u "${bincache}")"; fi
          cached_before="$({ find "${bincache}" -name '*.zip' 2>/dev/null || true; } | wc -l)"
          status=0
          $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed" || status=$?
          cached_after="$({ find "${bincache}" -name '*.zip' 2>/dev/null || true; } | wc -l)"
          echo "vcpkg binary cache: ${cached_before} -> ${cached_after} packages"
          if [ "${cached_after}" -gt "${cached_before}" ]; then
            echo "built=true" >> "${GITHUB_OUTPUT}"
          fi
          if [ "${status}" -ne 0 ]; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      # Saved right away whenever vcpkg built something, also when a port
      # failed, so the next run starts from the ports that did build.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-install.outputs.built == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: create unsigned dmg
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "NeoDesk Client.app" 200 190 --hide-extension "NeoDesk Client.app" --window-size 800 400 --app-drop-link 600 185 neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg "./flutter/build/macos/Build/Products/Release/NeoDesk Client.app"

      - name: Upload unsigned macOS app
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          tar -C "./flutter/build/macos/Build/Products/Release" \
            -czf "neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}-app.tar.gz" \
            "NeoDesk Client.app"
          # The app alone in a zip, to run it from the Downloads folder without
          # installing. ditto keeps the symlinks and attributes of the bundle.
          ditto -c -k --keepParent "./flutter/build/macos/Build/Products/Release/NeoDesk Client.app" \
            "neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}-app.zip"

      - name: Upload unsigned macOS app artifacts
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neodesk-unsigned-macos-${{ matrix.job.arch }}
          path: |
            neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
            neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}-app.tar.gz
            neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}-app.zip

      - name: Codesign app and create signed dmg
        if: env.MACOS_P12_BASE64 != null && env.UPLOAD_ARTIFACT == 'true'
        run: |
          # Patch create-dmg to give more attempts to unmount image
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          # Unlock keychain
          security default-keychain -s rustdesk.keychain
          security unlock-keychain -p ${{ secrets.MACOS_P12_PASSWORD }} rustdesk.keychain
          # start sign the rustdesk.app and dmg
          rm -rf *.dmg || true
          codesign --force --options runtime -s ${{ secrets.MACOS_CODESIGN_IDENTITY }} --deep --strict "./flutter/build/macos/Build/Products/Release/NeoDesk Client.app" -vvv
          create-dmg --icon "NeoDesk Client.app" 200 190 --hide-extension "NeoDesk Client.app" --window-size 800 400 --app-drop-link 600 185 neodesk-${{ env.VERSION }}.dmg "./flutter/build/macos/Build/Products/Release/NeoDesk Client.app"
          codesign --force --options runtime -s ${{ secrets.MACOS_CODESIGN_IDENTITY }} --deep --strict neodesk-${{ env.VERSION }}.dmg -vvv
          # notarize the neodesk-${{ env.VERSION }}.dmg
          rcodesign notary-submit --api-key-path ${{ github.workspace }}/rustdesk.json  --staple neodesk-${{ env.VERSION }}.dmg

      - name: Rename rustdesk
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          for name in neodesk*??.dmg; do
              mv "$name" "${name%%.dmg}-${{ matrix.job.arch }}.dmg"
          done

  build-rustdesk-linux:
    needs: [plan, generate-bridge]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.linux != '[]' &&
      needs.generate-bridge.result != 'skipped'
    name: build rustdesk linux ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm
          if [[ "${{ matrix.job.arch }}" == "x86_64" ]]; then
            sudo apt-get install -y qemu-user-static
          fi

      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          submodules: recursive

      - name: Set Swap Space
        if: ${{ matrix.job.arch == 'x86_64' }}
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      # cargo runs inside the build container on /workspace, which is this
      # checkout, so target/ outlives the container and this cache keeps it.
      # The container's crate registry is not kept; cargo downloads it again.
      - name: Cache Rust build
        if: matrix.job.rust-target-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: linux-${{ matrix.job.target }}
          cache-targets: true
          cache-on-failure: true

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # vcpkg 2026.07.29's SPDX scripts require CMake 4.3+, but this ARM64 runner selects CMake 3.31.
      - name: Install CMake for vcpkg on Linux ARM64
        if: matrix.job.arch == 'aarch64' && env.UPLOAD_ARTIFACT == 'true'
        run: |
          python3 -m pip install --user "cmake==${VCPKG_CMAKE_VERSION}"
          user_base="$(python3 -m site --user-base)"
          "${user_base}/bin/cmake" --version
          echo "${user_base}/bin" >> "${GITHUB_PATH}"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: vcpkg-${{ matrix.job.on }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.job.on }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-
            vcpkg-${{ matrix.job.on }}-${{ matrix.job.vcpkg-triplet }}-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-${{ matrix.job.on }}-${{ matrix.job.vcpkg-triplet }}-

      - name: Setup vcpkg
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        id: vcpkg-install
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          bincache="${VCPKG_BINCACHE}"
          if command -v cygpath >/dev/null; then bincache="$(cygpath -u "${bincache}")"; fi
          cached_before="$({ find "${bincache}" -name '*.zip' 2>/dev/null || true; } | wc -l)"
          status=0
          $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed" || status=$?
          cached_after="$({ find "${bincache}" -name '*.zip' 2>/dev/null || true; } | wc -l)"
          echo "vcpkg binary cache: ${cached_before} -> ${cached_after} packages"
          if [ "${cached_after}" -gt "${cached_before}" ]; then
            echo "built=true" >> "${GITHUB_OUTPUT}"
          fi
          if [ "${status}" -ne 0 ]; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      # Saved right away whenever vcpkg built something, also when a port
      # failed, so the next run starts from the ports that did build.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-install.outputs.built == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Restore bridge files
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # DRM capture for the Wayland login screen. The container's meson is too old to build
      # libdrmtap, so build it here from the pin in build.py (commit and source SHA-256 checked
      # there) and hand the .so to the container via DRMTAP_PREBUILT_DIR. Its SHA-256 goes along,
      # so every package can be checked to carry this very file.
      - name: Build libdrmtap
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y meson ninja-build pkg-config \
            libdrm-dev libegl1-mesa-dev libgles2-mesa-dev
          python3 scripts/test_check_drm_package.py
          python3 - <<'PY'
          import hashlib, importlib.util, sys
          spec = importlib.util.spec_from_file_location("b", "build.py")
          b = importlib.util.module_from_spec(spec)
          sys.argv = ["build.py"]
          spec.loader.exec_module(b)
          so = b.build_libdrmtap_so()
          digest = hashlib.sha256(open(so, "rb").read()).hexdigest()
          print(f"::notice::built {so}, SHA-256 {digest}")
          open("third_party/libdrmtap/build-pkg/libdrmtap.sha256", "w").write(digest + "\n")
          PY

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build rustdesk
        id: vcpkg
        if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
        with:
          arch: ${{ matrix.job.arch }}
          distro: ${{ matrix.job.distro }}
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            echo -e "installing deps"
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               cpio \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            # we have libopus compiled by us.
            apt-get remove -y libopus-dev || true
            # output devs
            ls -l ./
            tree -L 3 /opt/artifacts/vcpkg/installed
          run: |
            # disable git safe.directory
            git config --global --add safe.directory "*"
            # rust
            pushd /opt
            # do not use rustup, because memory overflow in qemu
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }} && ./install.sh
            rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}
            # edit config
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            cat ~/.cargo/config
            # start build
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            if [[ "${{ matrix.job.arch }}" == "aarch64" ]]; then
              export JOBS="--jobs 3"
            else
              export JOBS=""
            fi
            echo $JOBS
            # The container doesn't see the job's environment.
            export NEODESK_RELEASE_VERSION="${{ inputs.version }}"
            # The .so built on the runner; build.py checks it comes from the pinned checkout.
            export DRMTAP_PREBUILT_DIR=/workspace/third_party/libdrmtap/build-pkg
            # build.py names the features, so the library and the packaging agree on drm.
            FEATURES="$(python3 ./build.py --flutter --hwcodec --unix-file-copy-paste --print-features)"
            echo "cargo features: ${FEATURES}"
            case ",${FEATURES}," in *,drm,*) ;; *) echo "::error::no drm in ${FEATURES}"; exit 1 ;; esac
            cargo build --locked --lib $JOBS --features "${FEATURES}" --release
            # target/release/{deps,build} stay for the Rust cache step.
            du -sh /workspace/target || true

            # Setup Flutter
            # disable git safe.directory
            git config --global --add safe.directory "*"
            pushd /workspace
            case ${{ matrix.job.arch }} in
              aarch64)
                export PATH=/opt/flutter-elinux/bin:$PATH
                sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
                sed -i "s/x64\/release/arm64\/release/g" ./build.py
              ;;
              x86_64)
                export PATH=/opt/flutter/bin:$PATH
              ;;
            esac
            popd
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            case ${{ matrix.job.arch }} in
              aarch64)
                # clone repo and reset to flutter ${{ env.FLUTTER_VERSION }}
                git clone https://github.com/sony/flutter-elinux.git || true
                pushd flutter-elinux
                  git fetch
                  git reset --hard ${{ env.FLUTTER_VERSION }}
                  bin/flutter-elinux doctor -v
                  bin/flutter-elinux precache --linux
                popd
                cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
                rm -rf flutter
              ;;
              x86_64)
                flutter doctor -v
              ;;
            esac

            if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
              case ${{ matrix.job.arch }} in
                aarch64)
                  pushd /opt/flutter-elinux/flutter
                ;;
                x86_64)
                  pushd /opt/flutter
                ;;
              esac
              git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
              popd
            fi

            # build flutter
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=${{ matrix.job.deb_arch }}
            python3 ./build.py --flutter --skip-cargo
            SO_SHA256="$(cat /workspace/third_party/libdrmtap/build-pkg/libdrmtap.sha256)"
            for name in neodesk*??.deb; do
              python3 scripts/check_drm_package.py "$name" --so-sha256 "${SO_SHA256}"
              mv "$name" "${name%%.deb}-${{ matrix.job.arch }}.deb"
            done

            # rpm package, with the release's version (1.5.0~rc.4)
            echo -e "start packaging fedora package"
            pushd /workspace
            RPM_VERSION="$(python3 ./build.py --print-package-version)"
            sed -i "s/^Version: .*/Version:    ${RPM_VERSION}/" ./res/rpm-flutter.spec ./res/rpm-flutter-suse.spec
            case ${{ matrix.job.arch }} in
              aarch64)
                sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter.spec
                ;;
            esac
            # On aarch64 the flutter-elinux engine's own glibc needs are not measured, so the
            # glibc check runs on x86_64 only.
            RPM_CHECK_ARGS="--so-sha256 ${SO_SHA256}"
            if [[ "${{ matrix.job.arch }}" != "x86_64" ]]; then RPM_CHECK_ARGS="${RPM_CHECK_ARGS} --no-glibc-check"; fi
            HBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb
            pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
            for name in neodesk*??.rpm; do
                python3 /workspace/scripts/check_drm_package.py "$name" ${RPM_CHECK_ARGS}
                mv "$name" /workspace/"${name%%.rpm}.rpm"
            done

            # rpm suse package
            echo -e "start packaging suse package"
            pushd /workspace
            case ${{ matrix.job.arch }} in
              aarch64)
                sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter-suse.spec
                ;;
            esac
            HBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb
            pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
            for name in neodesk*??.rpm; do
                python3 /workspace/scripts/check_drm_package.py "$name" ${RPM_CHECK_ARGS}
                mv "$name" /workspace/"${name%%.rpm}-suse.rpm"
            done

      - name: Upload deb package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb
          path: neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb

      - name: Upload rpm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: neodesk-${{ env.VERSION }}-${{ matrix.job.arch }}-rpms
          path: |
            neodesk-*.rpm
